name: 📍 Milestone
description: Track a single milestone from an accepted RFP proposal — create one per milestone as a sub-issue of the proposal.
title: "[MILESTONE] RFP-XXX Mx — Milestone Name"
labels: ["milestone"]
assignees: ["hackyguru"]

body:
  - type: markdown
    attributes:
      value: |
        Use this template to break an **accepted** proposal into one issue per milestone so the
        engineering team can review deliverables independently. Create each milestone as a
        **sub-issue** of the parent proposal issue.

  - type: input
    id: parent-proposal
    attributes:
      label: Parent Proposal
      description: The accepted proposal issue this milestone belongs to.
      placeholder: "#112"
    validations:
      required: true

  - type: input
    id: rfp-id
    attributes:
      label: RFP ID
      placeholder: RFP-003
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team / Grantee
      placeholder: Gateway
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Milestone number and short name.
      placeholder: "M1 — Design, threat model, SDK trait surface"
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Checklist of everything that must be delivered for this milestone. Copied from the proposal.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: release-integrity
    attributes:
      label: Release Integrity Manifest
      description: |
        Required when the milestone delivers a Logos Basecamp module. Identify exactly the build delivered: the milestone is approved for this `rootHash`. Copy the values from the release sidecar JSON or `lgx manifest`; reviewers recompute them. Do not replace, delete or re-tag any listed release. See [Security and Release Integrity](https://github.com/logos-co/rfp#security-and-release-integrity).
      value: |
        - Security tier:
        - Source commit (full SHA):
        - Catalog URL (logos-repo.json):
        - Signer DID:
        - Logos Storage CID (if uploaded):

        | Package | Version | Release URL (immutable) | rootHash | SHA-256 of .lgx | Built variants |
        |---------|---------|-------------------------|----------|-----------------|----------------|
        |         |         |                         |          |                 |                |

  - type: input
    id: payout
    attributes:
      label: Payout (USD)
      description: Payout released on approval of this milestone.
      placeholder: "$24,500"

  - type: input
    id: duration
    attributes:
      label: Duration / Timeline
      placeholder: "3 weeks"

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance / Completion Criteria
      description: What the reviewer verifies before this milestone is approved for payout.

  - type: checkboxes
    id: review
    attributes:
      label: Engineering Review
      description: Checked off by the reviewing engineer before the milestone is approved.
      options:
        - label: Deliverables received and match the proposal scope
        - label: Code open-sourced under MIT / Apache 2.0
        - label: CI green on the default branch
        - label: "Basecamp modules only: `lgx verify` passes and the signer is the declared DID"
        - label: "Basecamp modules only: rootHash and SHA-256 recomputed and match the manifest"
        - label: "Basecamp modules only: delivered releases are immutable and hosted on a GitHub organisation"
        - label: "Security tier requirements met (Tier 1 data-handling note, Tier 2 threat model and controls)"
        - label: Docs / README delivered
        - label: Milestone approved for payout
