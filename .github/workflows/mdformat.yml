name: Check Markdown formatting
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install mdformat
        run: |
          pip install mdformat mdformat-gfm mdformat-frontmatter
      - name: Check Markdown formatting
        run: mdformat --check .
